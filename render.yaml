services:
  - type: web
    name: bynzuri-api
    runtime: python
    rootDir: backend
    buildCommand: ./render-build.sh
    startCommand: ./render-start.sh
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: REQUIRE_PERSISTENT_MEDIA
        value: "true"
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false
      - key: ORDER_NOTIFICATION_EMAIL
        value: hairskincare@bynzuri.com
      - key: SUPPORT_NOTIFICATION_EMAIL
        value: hairskincare@bynzuri.com
      - key: PUBLIC_SITE_URL
        value: https://www.bynzuri.com

  # Run migrations on the web service before enabling this scheduled sender.
  - type: cron
    name: bynzuri-order-email-sender
    runtime: python
    rootDir: backend
    schedule: "*/5 * * * *"
    buildCommand: ./render-build.sh
    startCommand: python manage.py process_order_emails --limit 100
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "HairSkin by Nzuri <hairskincare@bynzuri.com>"
      - key: RESEND_REPLY_TO
        value: hairskincare@bynzuri.com
      - key: ORDER_NOTIFICATION_EMAIL
        value: hairskincare@bynzuri.com
      - key: SUPPORT_NOTIFICATION_EMAIL
        value: hairskincare@bynzuri.com
      - key: PUBLIC_SITE_URL
        value: https://www.bynzuri.com
